[workspace]
members = [
    "m3_test",
    "spike",
    "m3_widget",
    "macros",
    "ui_core",
    "ui_widget"
]


[workspace.package]
edition = "2021"

# Shared dependency versions for every workspace member. Members opt in with
# `<name>.workspace = true` and may add extra features locally.
[workspace.dependencies]
skia-safe = "0.97.2"
skia-bindings = "0.97.2"
serde = { version = "1.0.228", features = ["derive"] }
winit = "0.30"
softbuffer = "0.4"
toml = "1.1.2"
taffy = "0.12.2"
# Pinned: it is days old and changes daily. See TODO.md.
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI", rev = "f2fd04c2f16006c3e8aa95047a506d9cd3db3970", default-features = false, features = ["wayland", "wayland-shell", "shell-audio", "shell-session"] }
anti-webui-md3e = { git = "https://github.com/bea4dev/AntiWebUI", rev = "f2fd04c2f16006c3e8aa95047a506d9cd3db3970" }
kurbo = "0.13"
# internal crates
macros = { path = "./macros" }
ui_core = { path = "./ui_core" }
ui_widget = { path = "./ui_widget" }
m3_widget = { path = "./m3_widget" }
m3_test = { path = "./m3_test" }

[package]
name = "my_shell"
version = "0.0.1"
edition.workspace = true

[dependencies]
anti-webui.workspace = true
anti-webui-md3e.workspace = true
kurbo.workspace = true
chrono = "0.4"
env_logger = "0.11.10"
hyprland = { git = "https://github.com/hyprland-community/hyprland-rs", branch = "master" }
log = "0.4.32"
mpris = "2.1.0"
niri-ipc = "26.4.0"
notify = "8.2.0"
serde.workspace = true
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
skia-bindings.workspace = true
skia-safe.workspace = true
tokio = { version = "1.52.3", features=["rt","macros","sync","time","process"]}
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }
toml.workspace = true
futures-util = "0.3.32"
ui_core.workspace = true
